<script>
var PC_CONFIG = {
  name:          "Jane Smith",
  title:         "Lead Designer",
  handle:        "janesmith",
  status:        "Available",
  avatarUrl:     "https://i.pravatar.cc/300",
  contactText:   "Contact Me",
  contactUrl:    "#contact",
  innerGradient: "linear-gradient(145deg,#60496e8c 0%,#71C4FF44 100%)",
  glowColor:     "rgba(125, 190, 255, 0.67)",
  glowSize:      "50%",
  enableTilt:    true

<!-- ── END USER CONFIG ──────────────────────────────────── -->

<div id="pc-mount" style="display:flex;justify-content:center;align-items:center;padding:40px 20px;"></div>

<style>
.pc-card-wrapper{perspective:500px;transform:translate3d(0,0,.1px);position:relative;touch-action:none;display:inline-block;}
.pc-behind{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at var(--pc-pointer-x) var(--pc-pointer-y),var(--pc-behind-glow-color) 0%,transparent var(--pc-behind-glow-size));filter:blur(50px) saturate(1.1);opacity:calc(.8 * var(--pc-card-opacity));transition:opacity 200ms ease;}
.pc-card-wrapper.active{--pc-card-opacity:1;}
.pc-card{height:80svh;max-height:540px;display:grid;aspect-ratio:.718;border-radius:var(--pc-card-radius);position:relative;background-blend-mode:color-dodge,normal,normal,normal;animation:pc-glow-bg 12s linear infinite;box-shadow:rgba(0,0,0,.8) calc((var(--pc-pointer-from-left) * 10px) - 3px) calc((var(--pc-pointer-from-top) * 20px) - 6px) 20px -5px;transition:transform 1s ease;transform:translateZ(0) rotateX(0deg) rotateY(0deg);background:rgba(0,0,0,.9);backface-visibility:hidden;overflow:hidden;}
.pc-card-shell.active .pc-card{transition:none;transform:translateZ(0) rotateX(var(--pc-rotate-y)) rotateY(var(--pc-rotate-x));}
.pc-card-shell.entering .pc-card{transition:transform 180ms ease-out;}
.pc-card-shell{position:relative;z-index:1;}
.pc-card *{display:grid;grid-area:1/-1;border-radius:var(--pc-card-radius);pointer-events:none;}
.pc-inside{inset:0;position:absolute;background-image:var(--pc-inner-gradient);background-color:rgba(0,0,0,.9);transform:none;}
.pc-shine{mask-image:none;transition:filter .8s ease;filter:brightness(.66) contrast(1.33) saturate(.33) opacity(.5);animation:pc-holo-bg 18s linear infinite;animation-play-state:running;mix-blend-mode:color-dodge;}
.pc-shine,.pc-shine::after{--space:5%;--angle:-45deg;transform:translate3d(0,0,1px);overflow:hidden;z-index:3;background:transparent;background-size:cover;background-position:center;background-image:repeating-linear-gradient(0deg,var(--pc-s1) calc(var(--space)*1),var(--pc-s2) calc(var(--space)*2),var(--pc-s3) calc(var(--space)*3),var(--pc-s4) calc(var(--space)*4),var(--pc-s5) calc(var(--space)*5),var(--pc-s6) calc(var(--space)*6),var(--pc-s1) calc(var(--space)*7)),repeating-linear-gradient(var(--angle),#0e152e 0%,hsl(180,10%,60%) 3.8%,hsl(180,29%,66%) 4.5%,hsl(180,10%,60%) 5.2%,#0e152e 10%,#0e152e 12%),radial-gradient(farthest-corner circle at var(--pc-pointer-x) var(--pc-pointer-y),hsla(0,0%,0%,.1) 12%,hsla(0,0%,0%,.15) 20%,hsla(0,0%,0%,.25) 120%);background-position:0 var(--pc-bg-y),var(--pc-bg-x) var(--pc-bg-y),center;background-blend-mode:color,hard-light;background-size:500% 500%,300% 300%,200% 200%;background-repeat:repeat;}
.pc-shine::before,.pc-shine::after{content:'';background-position:center;background-size:cover;grid-area:1/1;opacity:0;transition:opacity .8s ease;}
.pc-card-shell.active .pc-shine{filter:brightness(.85) contrast(1.5) saturate(.5);animation-play-state:paused;}
.pc-card-shell.active .pc-shine::before,.pc-card-shell.active .pc-shine::after{opacity:1;}
.pc-shine::before{background-image:linear-gradient(45deg,var(--pc-s4),var(--pc-s5),var(--pc-s6),var(--pc-s1),var(--pc-s2),var(--pc-s3)),radial-gradient(circle at var(--pc-pointer-x) var(--pc-pointer-y),hsl(0,0%,70%) 0%,hsla(0,0%,30%,.2) 90%);background-size:250% 250%,100% 100%;background-position:var(--pc-pointer-x) var(--pc-pointer-y),center;background-blend-mode:color-dodge;filter:brightness(calc(2 - var(--pc-pointer-from-center))) contrast(calc(var(--pc-pointer-from-center) + 2)) saturate(calc(.5 + var(--pc-pointer-from-center)));mix-blend-mode:luminosity;}
.pc-shine::after{background-position:0 var(--pc-bg-y),calc(var(--pc-bg-x)*.4) calc(var(--pc-bg-y)*.5),center;background-size:200% 300%,700% 700%,100% 100%;mix-blend-mode:difference;filter:brightness(.8) contrast(1.5);}
.pc-glare{transform:translate3d(0,0,1.1px);overflow:hidden;background-image:radial-gradient(farthest-corner circle at var(--pc-pointer-x) var(--pc-pointer-y),hsl(248,25%,80%) 12%,hsla(207,40%,30%,.8) 90%);mix-blend-mode:overlay;filter:brightness(.8) contrast(1.2);z-index:4;}
.pc-avatar-content{mix-blend-mode:luminosity;overflow:visible;transform:translateZ(2px);backface-visibility:hidden;}
.pc-avatar-content .pc-avatar{width:100%;position:absolute;left:50%;transform-origin:50% 100%;transform:translateX(calc(-50% + (var(--pc-pointer-from-left) - .5)*6px)) translateZ(0) scaleY(calc(1 + (var(--pc-pointer-from-top) - .5)*.02)) scaleX(calc(1 + (var(--pc-pointer-from-left) - .5)*.01));bottom:-1px;backface-visibility:hidden;will-change:transform;transition:transform 120ms ease-out;}
.pc-avatar-content::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;}
.pc-user-info{position:absolute;--ui-inset:20px;bottom:var(--ui-inset);left:var(--ui-inset);right:var(--ui-inset);z-index:2;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.1);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.1);border-radius:calc(max(0px,var(--pc-card-radius) - var(--ui-inset) + 6px));padding:12px 14px;pointer-events:auto;box-sizing:border-box;}
.pc-user-details{display:flex;align-items:center;gap:12px;}
.pc-mini-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.1);flex-shrink:0;}
.pc-mini-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pc-user-text{display:flex;align-items:flex-start;flex-direction:column;gap:6px;}
.pc-handle{font-size:14px;font-weight:500;color:rgba(255,255,255,.9);line-height:1;}
.pc-status{font-size:14px;color:rgba(255,255,255,.7);line-height:1;}
.pc-contact-btn{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px 16px;font-size:12px;font-weight:600;color:rgba(255,255,255,.9)!important;cursor:pointer;transition:all .2s ease;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-decoration:none!important;display:inline-block;line-height:1;}
.pc-contact-btn:hover{border-color:rgba(255,255,255,.4);transform:translateY(-1px);}
.pc-content:not(.pc-avatar-content){max-height:100%;overflow:hidden;text-align:center;position:relative;transform:translate3d(calc(var(--pc-pointer-from-left)*-6px + 3px),calc(var(--pc-pointer-from-top)*-6px + 3px),.1px);z-index:5;mix-blend-mode:luminosity;}
.pc-details{width:100%;position:absolute;top:3em;display:flex;flex-direction:column;}
.pc-details h3{font-weight:600;margin:0;font-size:min(5svh,3em);background-image:linear-gradient(to bottom,#fff,#6f6fbe);background-size:1em 1.5em;-webkit-text-fill-color:transparent;background-clip:text;-webkit-background-clip:text;}
.pc-details p{font-weight:600;position:relative;top:-12px;white-space:nowrap;font-size:16px;margin:0 auto;width:min-content;background-image:linear-gradient(to bottom,#fff,#4a4ac0);background-size:1em 1.5em;-webkit-text-fill-color:transparent;background-clip:text;-webkit-background-clip:text;}
@keyframes pc-glow-bg{0%{--bgrotate:0deg}100%{--bgrotate:360deg}}
@keyframes pc-holo-bg{0%{background-position:0 var(--pc-bg-y),0 0,center}100%{background-position:0 var(--pc-bg-y),90% 90%,center}}
@media(max-width:768px){.pc-card{height:70svh;max-height:450px}.pc-details{top:2em}.pc-details h3{font-size:min(4svh,2.5em)}.pc-details p{font-size:14px}.pc-user-info{--ui-inset:15px;padding:10px 12px}.pc-mini-avatar{width:28px;height:28px}.pc-user-details{gap:10px}.pc-handle{font-size:13px}.pc-status{font-size:10px}.pc-contact-btn{padding:6px 12px;font-size:11px}}
@media(max-width:480px){.pc-card{height:60svh;max-height:380px}.pc-details{top:1.5em}.pc-details h3{font-size:min(3.5svh,2em)}.pc-details p{font-size:12px;top:-8px}.pc-user-info{--ui-inset:12px;padding:8px 10px}.pc-mini-avatar{width:24px;height:24px}.pc-user-details{gap:8px}.pc-handle{font-size:12px}.pc-status{font-size:9px}.pc-contact-btn{padding:5px 10px;font-size:10px;border-radius:50px}}
</style>

<script>
(function () {
  var CFG = window.PC_CONFIG || {};
  var name          = CFG.name          || 'Your Name';
  var title         = CFG.title         || 'Your Title';
  var handle        = CFG.handle        || 'yourhandle';
  var status        = CFG.status        || 'Available';
  var avatarUrl     = CFG.avatarUrl     || '';
  var contactText   = CFG.contactText   || 'Contact Me';
  var contactUrl    = CFG.contactUrl    || '#contact';
  var innerGradient = CFG.innerGradient || 'linear-gradient(145deg,#60496e8c 0%,#71C4FF44 100%)';
  var glowColor     = CFG.glowColor     || 'rgba(125,190,255,0.67)';
  var glowSize      = CFG.glowSize      || '50%';
  var enableTilt    = CFG.enableTilt !== false;

  /* ── build HTML ─────────────────────────────────────────── */
  var avatarHtml = avatarUrl
    ? '<img class="pc-avatar" src="' + avatarUrl + '" alt="' + name + ' avatar" loading="lazy">'
    : '';

  var miniAvatarHtml = avatarUrl
    ? '<div class="pc-mini-avatar"><img src="' + avatarUrl + '" alt="" loading="lazy"></div>'
    : '';

  var userInfoHtml =
    '<div class="pc-user-info">' +
      '<div class="pc-user-details">' +
        miniAvatarHtml +
        '<div class="pc-user-text">' +
          '<div class="pc-handle">@' + handle + '</div>' +
          '<div class="pc-status">'  + status  + '</div>' +
        '</div>' +
      '</div>' +
      '<a href="' + contactUrl + '" class="pc-contact-btn" aria-label="Contact ' + name + '">' +
        contactText +
      '</a>' +
    '</div>';

  var html =
    '<div class="pc-card-wrapper" style="' +
        '--pc-inner-gradient:' + innerGradient + ';' +
        '--pc-behind-glow-color:' + glowColor + ';' +
        '--pc-behind-glow-size:' + glowSize + ';' +
        '--pc-card-opacity:0;' +
        '--pc-pointer-x:50%;--pc-pointer-y:50%;' +
        '--pc-pointer-from-center:0;--pc-pointer-from-top:.5;--pc-pointer-from-left:.5;' +
        '--pc-rotate-x:0deg;--pc-rotate-y:0deg;' +
        '--pc-bg-x:50%;--pc-bg-y:50%;' +
        '--pc-card-radius:30px;' +
        '--pc-s1:hsl(2,100%,73%);--pc-s2:hsl(53,100%,69%);--pc-s3:hsl(93,100%,69%);' +
        '--pc-s4:hsl(176,100%,76%);--pc-s5:hsl(228,100%,74%);--pc-s6:hsl(283,100%,73%);' +
    '">' +
      '<div class="pc-behind"></div>' +
      '<div class="pc-card-shell">' +
        '<section class="pc-card">' +
          '<div class="pc-inside">' +
            '<div class="pc-shine"></div>' +
            '<div class="pc-glare"></div>' +
            '<div class="pc-content pc-avatar-content">' +
              avatarHtml +
              userInfoHtml +
            '</div>' +
            '<div class="pc-content">' +
              '<div class="pc-details">' +
                '<h3>' + name  + '</h3>' +
                '<p>'  + title + '</p>'  +
              '</div>' +
            '</div>' +
          '</div>' +
        '</section>' +
      '</div>' +
    '</div>';

  var mount = document.getElementById('pc-mount');
  if (mount) mount.innerHTML = html;

  /* ── tilt engine ────────────────────────────────────────── */
  if (!enableTilt) return;

  var INIT_DUR  = 1200, INIT_X = 70, INIT_Y = 60, ENTER_MS = 180;

  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo === undefined ? 0 : lo), hi === undefined ? 100 : hi); }
  function rnd(v)  { return parseFloat(v.toFixed(3)); }
  function adj(v, a, b, c, d) { return rnd(c + ((d - c) * (v - a)) / (b - a)); }

  function initTilt(wrap) {
    var shell = wrap.querySelector('.pc-card-shell');
    if (!shell) return;

    var rafId = null, running = false, lastTs = 0;
    var cx = 0, cy = 0, tx = 0, ty = 0;
    var initUntil = 0;

    function setVars(x, y) {
      var w = shell.clientWidth  || 1;
      var h = shell.clientHeight || 1;
      var px = clamp((100 / w) * x);
      var py = clamp((100 / h) * y);
      wrap.style.setProperty('--pc-pointer-x',         px + '%');
      wrap.style.setProperty('--pc-pointer-y',         py + '%');
      wrap.style.setProperty('--pc-bg-x',              adj(px, 0, 100, 35, 65) + '%');
      wrap.style.setProperty('--pc-bg-y',              adj(py, 0, 100, 35, 65) + '%');
      wrap.style.setProperty('--pc-pointer-from-center', clamp(Math.hypot(py-50, px-50)/50, 0, 1));
      wrap.style.setProperty('--pc-pointer-from-top',    py / 100);
      wrap.style.setProperty('--pc-pointer-from-left',   px / 100);
      wrap.style.setProperty('--pc-rotate-x',  rnd(-((px-50)/5)) + 'deg');
      wrap.style.setProperty('--pc-rotate-y',  rnd((py-50)/4)    + 'deg');
    }

    function step(ts) {
      if (!running) return;
      if (!lastTs) lastTs = ts;
      var dt  = (ts - lastTs) / 1000; lastTs = ts;
      var tau = ts < initUntil ? 0.6 : 0.14;
      var k   = 1 - Math.exp(-dt / tau);
      cx += (tx - cx) * k;
      cy += (ty - cy) * k;
      setVars(cx, cy);
      if (Math.abs(tx-cx) > 0.05 || Math.abs(ty-cy) > 0.05 || document.hasFocus()) {
        rafId = requestAnimationFrame(step);
      } else { running = false; lastTs = 0; rafId = null; }
    }

    function start() { if (running) return; running = true; lastTs = 0; rafId = requestAnimationFrame(step); }
    function toCenter() { tx = shell.clientWidth/2; ty = shell.clientHeight/2; start(); }

    var enterTimer = null, leaveRaf = null;

    shell.addEventListener('pointerenter', function (e) {
      shell.classList.add('active', 'entering');
      if (enterTimer) clearTimeout(enterTimer);
      enterTimer = setTimeout(function () { shell.classList.remove('entering'); }, ENTER_MS);
      var r = shell.getBoundingClientRect();
      tx = e.clientX - r.left; ty = e.clientY - r.top; start();
    });

    shell.addEventListener('pointermove', function (e) {
      var r = shell.getBoundingClientRect();
      tx = e.clientX - r.left; ty = e.clientY - r.top; start();
    });

    shell.addEventListener('pointerleave', function () {
      toCenter();
      function check() {
        if (Math.hypot(tx-cx, ty-cy) < 0.6) { shell.classList.remove('active'); leaveRaf = null; }
        else { leaveRaf = requestAnimationFrame(check); }
      }
      if (leaveRaf) cancelAnimationFrame(leaveRaf);
      leaveRaf = requestAnimationFrame(check);
    });

    cx = (shell.clientWidth || 0) - INIT_X;
    cy = INIT_Y;
    setVars(cx, cy);
    toCenter();
    initUntil = performance.now() + INIT_DUR;
    start();
  }

  function run() {
    var cards = document.querySelectorAll('.pc-card-wrapper');
    for (var i = 0; i < cards.length; i++) initTilt(cards[i]);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
